<style>
  :root {
    --accent: #C8341C;
    --bg: #FAFAFA;
    --surface: #FFFFFF;
    --border: #E4E4E4;
    --text: #1C1C1C;
    --text-muted: #6B6B6B;
    --ok: #2E7D32;
    --fail: #B3261E;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  a { color: var(--accent); }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 8px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; min-width: 0; }
  header .brand span { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .brand img { height: 32px; width: 32px; border-radius: 7px; flex-shrink: 0; }
  .login-logo { height: 96px; width: 96px; border-radius: 20px; margin-bottom: 18px; box-shadow: 0 6px 24px rgba(200,52,28,0.25); }
  header .user-box { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px 14px; font-size: 14px; color: var(--text-muted); }
  @media (max-width: 600px) {
    header { padding: 12px 16px; flex-wrap: nowrap; }
    header .brand { font-size: 14px; gap: 6px; flex-shrink: 1; }
    header .brand img { height: 26px; width: 26px; }
    header .user-box { font-size: 13px; gap: 6px 8px; flex-shrink: 0; }
  }
  .tabs-wrap { position: relative; background: var(--surface); border-bottom: 1px solid var(--border); }
  .tabs-wrap::after {
    content: "";
    position: absolute; top: 0; right: 0; bottom: 0; width: 30px;
    background: linear-gradient(to right, transparent, rgba(0,0,0,0.06));
    pointer-events: none;
  }
  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 0 24px;
    background: var(--surface);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    background: none;
    border: none;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    flex-shrink: 0;
  }
  nav.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .menu-btn {
    display: none;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
  }
  .menu-btn svg { width: 20px; height: 20px; stroke: currentColor; }
  .mobile-menu { display: none; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px 14px; }
  .mobile-menu.open { display: block; }
  .mobile-menu .mm-user { font-size: 13px; color: var(--text-muted); padding: 8px 4px 12px; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .mobile-menu button.mm-tab {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 12px 10px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
  }
  .mobile-menu button.mm-tab.active { color: var(--accent); background: #FDF3F1; }
  @media (max-width: 700px) {
    .tabs-wrap { display: none; }
    .menu-btn { display: flex; }
    header .user-box .user-name-text { display: none; }
  }
  main { max-width: 880px; margin: 0 auto; padding: 28px 20px calc(80px + env(safe-area-inset-bottom, 0px)); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 6px; font-size: 16px; }
  .card p { margin: 4px 0; color: var(--text-muted); font-size: 14px; word-break: break-word; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; flex-wrap: wrap; }
  .btn-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button.btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  button.btn:disabled { opacity: 0.5; cursor: default; }
  button.btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  button.btn.small { padding: 8px 14px; font-size: 13px; }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--surface);
    color: var(--text);
  }
  input[type=checkbox], input[type=radio] {
    appearance: none;
    -webkit-appearance: none;
    margin: 0;
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid #C7C7C7;
    background: var(--surface);
    flex-shrink: 0;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s, background 0.15s;
  }
  input[type=checkbox] { border-radius: 6px; }
  input[type=radio] { border-radius: 50%; }
  input[type=checkbox]:checked, input[type=radio]:checked {
    border-color: var(--accent);
    background: var(--accent);
  }
  input[type=checkbox]:checked::after {
    content: "";
    position: absolute;
    left: 7px; top: 3px;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  input[type=radio]:checked::after {
    content: "";
    position: absolute;
    left: 50%; top: 50%;
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  textarea { min-height: 90px; resize: vertical; }
  label.field { display: block; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--text-muted); }
  label.field > * { margin-top: 6px; }
  .login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 90vh;
    text-align: center;
    padding: 20px;
  }
  .login-screen h1 { font-size: 26px; margin-bottom: 6px; }
  .login-screen p { color: var(--text-muted); margin-bottom: 24px; }
  .chapter { margin-bottom: 18px; }
  .chapter h4 { margin: 0 0 8px; font-size: 15px; }
  .section-block { padding: 10px 0; border-top: 1px solid var(--border); }
  .section-block:first-child { border-top: none; }
  .section-block strong { display: block; margin-bottom: 4px; font-size: 14px; }
  .section-block p { font-size: 14px; line-height: 1.5; color: var(--text); }
  .timer {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 8px;
    background: #FDEEEC;
    color: var(--accent);
  }
  .question .qtext { font-weight: 600; margin-bottom: 10px; font-size: 14px; }
  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 2px;
    font-size: 14px;
  }
  label.option-row {
    cursor: pointer;
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    transition: background 0.15s, border-color 0.15s;
  }
  label.option-row:hover { background: #FAFAFA; border-color: #D6D6D6; }
  label.option-row:has(input:checked) { border-color: var(--accent); background: #FDF3F1; }
  .points-tag { font-size: 12px; color: var(--text-muted); font-weight: 500; white-space: nowrap; flex-shrink: 0; margin-left: 12px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .badge.pass { background: #E8F5E9; color: var(--ok); }
  .badge.fail { background: #FCE8E6; color: var(--fail); }
  .badge.pending { background: #FFF4E5; color: #92600B; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .empty { color: var(--text-muted); font-size: 14px; padding: 20px 0; text-align: center; }
  .error-banner {
    background: #FCE8E6;
    color: var(--fail);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
  .list-item {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .list-item:last-child { border-bottom: none; }
  .list-item > span:first-child { flex: 1 1 220px; }
  code.code-pill {
    background: #F1F1F1;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 0.05em;
  }
</style>
</head>

  for (const k in attrs) {
    if (k === "text") node.textContent = attrs[k];
    else if (k === "html") node.innerHTML = attrs[k];
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), attrs[k]);
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) node.appendChild(c); });
  return node;
}

function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return d.toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}

async function boot() {
  const params = new URLSearchParams(location.search);
  const errorParam = params.get("error");
  try {
    const me = await api("/api/me");
    state.me = me.authenticated ? me : null;
  } catch (e) {
    state.me = null;
  }
  if (errorParam) state.loginError = errorMessage(errorParam);
  if (!state.me) {
    state.view = "login";
  } else {
    state.view = "app";
    state.tab = defaultTab(state.me.role);
  }
  render();
}

function errorMessage(code) {
  const map = {
    oauth: "Die Discord-Anmeldung ist fehlgeschlagen. Bitte erneut versuchen.",
    not_configured: "Der Bot wurde noch nicht per /setup konfiguriert.",
    not_member: "Du bist nicht Mitglied des zugehörigen Discord-Servers.",
    no_role: "Dir ist keine der konfigurierten Rollen zugewiesen.",
  };
  return map[code] || "Anmeldung fehlgeschlagen.";
}

function defaultTab(role) {
  if (role === "mitarbeiter") return "fortbildungen";
  if (role === "fortbilder") return "codes";
  return "codes";
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.view === "loading") {
    app.appendChild(el("div", { class: "empty", text: "Wird geladen ..." }));
    return;
  }
  if (state.view === "login") {
    app.appendChild(renderLogin());
    return;
  }
  if (state.view === "exam") {
    app.appendChild(renderExamShell());
    return;
  }
  app.appendChild(renderShell());
}

  mobileMenu.appendChild(el("div", { class: "mm-user", text: state.me.username + " · " + roleLabel(state.me.role) }));
  tabs.forEach(t => {

function roleLabel(role) {
  return { mitarbeiter: "Mitarbeiter", fortbilder: "Fortbilder", fortbildungsleitung: "Fortbildungsleitung" }[role] || role;
}

function tabsForRole(role) {
  const t = [];
  if (role === "mitarbeiter" || role === "fortbilder" || role === "fortbildungsleitung") {
    t.push({ id: "fortbildungen", label: "Fortbildungen" });
    t.push({ id: "ergebnisse", label: "Meine Ergebnisse" });
  }
  if (role === "fortbilder" || role === "fortbildungsleitung") {
    t.push({ id: "codes", label: "Codes erstellen" });
    t.push({ id: "bewertung", label: "Bewertung" });
  }
  if (role === "fortbildungsleitung") {
    t.push({ id: "tests", label: "Tests verwalten" });
    t.push({ id: "alle-ergebnisse", label: "Alle Ergebnisse" });
  }
  return t;
}

async function loadTab() {
  const main = document.getElementById("main");
  if (!main) return;
  try {
    if (state.tab === "fortbildungen") await tabFortbildungen(main);
    else if (state.tab === "ergebnisse") await tabErgebnisse(main);
    else if (state.tab === "codes") await tabCodes(main);
    else if (state.tab === "bewertung") await tabBewertung(main);
    else if (state.tab === "tests") await tabTests(main);
    else if (state.tab === "alle-ergebnisse") await tabAlleErgebnisse(main);
  } catch (e) {
    main.innerHTML = "";
    main.appendChild(el("div", { class: "error-banner", text: "Fehler beim Laden: " + e.message }));
  }
}

      startExam(res.attempt_id);
    } catch (e) {
      const err = e.body && e.body.error;
      let msg = "Fehler beim Einlösen des Codes.";
      if (err === "invalid_code") msg = "Ungültiger Code.";
      else if (err === "code_used") msg = "Dieser Code wurde bereits verwendet.";
      else if (err === "prerequisite_not_met") msg = "Dafür muss zuerst \"" + e.body.prerequisite_title + "\" bestanden werden.";
      codeErr.appendChild(el("div", { class: "error-banner", text: msg }));
    }
  });
  const row = el("div", { class: "row" }, [codeInput, codeBtn]);
  row.style.marginTop = "10px";
  codeCard.appendChild(row);
  codeCard.appendChild(codeErr);
  main.appendChild(codeCard);

  trainings.forEach(t => {
    const card = el("div", { class: "card" });
    const head = el("div", { class: "row" }, [
      el("h3", { text: t.title }),
      el("span", { class: "muted", text: t.time_limit_minutes + " Min. · " + t.max_points + " Punkte" }),
    ]);
    card.appendChild(head);
    const content = el("div", { style: "display:none; margin-top:14px" });
    const toggle = el("button", { class: "btn secondary small", text: "Lerninhalt anzeigen" });
    toggle.addEventListener("click", async () => {
      if (content.style.display === "none") {
        if (!content.dataset.loaded) {
          const detail = await api("/api/trainings/" + t.id);
          content.innerHTML = "";
          detail.content.forEach(ch => {
            const chapEl = el("div", { class: "chapter" }, [el("h4", { text: ch.chapter })]);
            ch.sections.forEach(s => {
              chapEl.appendChild(el("div", { class: "section-block" }, [
                el("strong", { text: s.title }),
                el("p", { text: s.text }),
              ]));
            });
            content.appendChild(chapEl);
          });
          content.dataset.loaded = "1";
        }
        content.style.display = "block";
        toggle.textContent = "Lerninhalt ausblenden";
      } else {
        content.style.display = "none";
        toggle.textContent = "Lerninhalt anzeigen";
      }
    });
    card.appendChild(toggle);
    card.appendChild(content);
    main.appendChild(card);
  });
}

function showModal(title, bodyText, okLabel, onOk, cancelLabel) {
  const overlay = el("div", {
    style: "position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px",
  });
  const box = el("div", { class: "card", style: "max-width:420px; width:100%" }, [
    el("h3", { text: title }),
    el("p", { text: bodyText }),
  ]);
  const btnRow = el("div", { class: "row", style: "margin-top:16px; justify-content:flex-end" });
  if (cancelLabel) {
    const cancelBtn = el("button", { class: "btn secondary", text: cancelLabel });
    cancelBtn.addEventListener("click", () => overlay.remove());
    btnRow.appendChild(cancelBtn);
  }
  const okBtn = el("button", { class: "btn", text: okLabel });
  okBtn.addEventListener("click", () => { overlay.remove(); onOk(); });
  btnRow.appendChild(okBtn);
  box.appendChild(btnRow);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

function confirmAndOpenMyResult(resultId, testTitle) {
  showModal(
    "Einmalige Ansicht",
    "Du kannst dieses Ergebnis nur einmal ansehen - und maximal 15 Minuten lang. " +
    "Sobald die Zeit abgelaufen ist oder du die Ansicht verlässt, kannst du sie nicht erneut öffnen.",
    "Jetzt ansehen",
    () => openMyResult(resultId, testTitle),
    "Abbrechen",
  );
}

let myResultTimer = null;

async function openMyResult(resultId, testTitle) {
  const main = document.getElementById("main");
  let out;
  try {
    out = await api("/api/results/mine/" + resultId + "/view", { method: "POST" });
  } catch (e) {
    main.innerHTML = "";
    main.appendChild(el("div", { class: "error-banner", text: "Dieses Ergebnis wurde bereits angesehen und ist nicht mehr abrufbar." }));
    const back = el("button", { class: "btn secondary small", text: "Zurück" });
    back.addEventListener("click", () => { state.tab = "ergebnisse"; loadTab(); });
    main.appendChild(back);
    return;
  }

  const r = out.result;
  const questions = out.questions;
  main.innerHTML = "";

  function leave() {
    if (myResultTimer) clearInterval(myResultTimer);
    state.tab = "ergebnisse";
    loadTab();
  }

  const back = el("button", { class: "btn secondary small", text: "< Zurück" });
  back.addEventListener("click", leave);
  const timerBadge = el("span", { class: "timer", style: "margin-left:10px" });
  main.appendChild(el("div", { class: "row" }, [back, timerBadge]));

  const passed = r.percent >= 60;
  main.appendChild(el("div", { class: "card" }, [
    el("div", { class: "row" }, [
      el("h3", { text: testTitle }),
      el("span", { class: "badge " + (passed ? "pass" : "fail"), text: (passed ? "Bestanden" : "Nicht bestanden") + " · Note " + r.grade }),
    ]),
    el("p", { text: r.total_score + " / " + r.max_points + " Punkte (" + r.percent + " %)" }),
    r.comment ? el("p", { text: "Kommentar der Bewertung: " + r.comment }) : null,
  ]));

  questions.forEach(q => {
    const given = r.answers[q.id];
    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "qtext", text: q.text + " (" + q.points + " Punkte)" }));
    if (q.type === "mc") {
      const correctIdx = new Set(q.correct);
      const givenIdx = new Set(Array.isArray(given) ? given : []);
      q.options.forEach((opt, i) => {
        card.appendChild(el("div", { class: "option-row", text: (givenIdx.has(i) ? "☑ " : "☐ ") + opt + (correctIdx.has(i) ? "  (richtig)" : "") }));
      });
    } else if (q.type === "tf") {
      [true, false].forEach(val => {
        const isGiven = given === val;
        const isCorrect = q.correct === val;
        card.appendChild(el("div", { class: "option-row", text: (isGiven ? "☑ " : "☐ ") + (val ? "Richtig" : "Falsch") + (isCorrect ? "  (richtig)" : "") }));
      });
    } else {
      card.appendChild(el("p", { text: given || "(keine Antwort)" }));
      const pts = (r.manual_points || {})[q.id];
      card.appendChild(el("p", { class: "muted", text: "Vergebene Punkte: " + (pts !== undefined ? pts : "0") + " / " + q.points }));
      const note = (r.question_comments || {})[q.id];
      if (note) card.appendChild(el("p", { text: "Kommentar: " + note }));
    }
    main.appendChild(card);
  });

  const deadline = new Date(out.view_expires_at).getTime();
  function tick() {
    const remain = Math.max(0, deadline - Date.now());
    const mins = Math.floor(remain / 60000);
    const secs = Math.floor((remain % 60000) / 1000);
    timerBadge.textContent = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    if (remain <= 0) {
      clearInterval(myResultTimer);
      leave();
    }
  }
  tick();
  myResultTimer = setInterval(tick, 1000);
}

async function openGrading(resultId) {
  const main = document.getElementById("main");
  const detail = await api("/api/results/" + resultId);
  const r = detail.result;
  const questions = detail.questions;
  main.innerHTML = "";

  const back = el("button", { class: "btn secondary small", text: "< Zurück" });
  back.addEventListener("click", () => loadTab());
  main.appendChild(back);

  const head = el("div", { class: "card" }, [
    el("h3", { text: r.username + " - " + r.test_title }),
    el("p", { class: "muted", text: "Automatisch erreichte Punkte (Multiple Choice / Richtig-Falsch): " + r.auto_score }),
  ]);
  main.appendChild(head);

  const inputs = {};
  const commentInputs = {};
  questions.forEach(q => {
    const given = r.answers[q.id];
    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "qtext", text: q.text + " (" + q.points + " Punkte)" }));

    if (q.type === "mc") {
      const correctIdx = new Set(q.correct);
      const givenIdx = new Set(Array.isArray(given) ? given : []);
      q.options.forEach((opt, i) => {
        const ok = correctIdx.has(i);
        const chosen = givenIdx.has(i);
        card.appendChild(el("div", { class: "option-row", text: (chosen ? "☑ " : "☐ ") + opt + (ok ? "  (richtig)" : "") }));
      });
      card.appendChild(el("p", { class: "muted", text: "Automatisch bewertet." }));
    } else if (q.type === "tf") {
      [true, false].forEach(val => {
        const isGiven = given === val;
        const isCorrect = q.correct === val;
        card.appendChild(el("div", { class: "option-row", text: (isGiven ? "☑ " : "☐ ") + (val ? "Richtig" : "Falsch") + (isCorrect ? "  (richtig)" : "") }));
      });
      card.appendChild(el("p", { class: "muted", text: "Automatisch bewertet." }));
    } else {
      card.appendChild(el("p", { text: given || "(keine Antwort)" }));
      const pointsInput = el("input", { type: "number", min: "0", max: String(q.points), step: "0.5", value: "0" });
      inputs[q.id] = pointsInput;
      card.appendChild(el("label", { class: "field", text: "Vergebene Punkte (max. " + q.points + ")" }, [pointsInput]));
      const commentInput = el("textarea", { placeholder: "Kommentar zu dieser Frage (optional)" });
      commentInputs[q.id] = commentInput;
      card.appendChild(el("label", { class: "field", text: "Kommentar zu dieser Frage" }, [commentInput]));
    }
    main.appendChild(card);
  });

  const commentBox = el("textarea", { placeholder: "Kommentar an den Mitarbeiter (optional)" });
  const commentCard = el("div", { class: "card" }, [
    el("label", { class: "field", text: "Gesamtkommentar" }, [commentBox]),
  ]);
  main.appendChild(commentCard);

  const err = el("div");
  const submitBtn = el("button", { class: "btn", text: "Bewertung abschliessen" });
  submitBtn.addEventListener("click", async () => {
    const manual_points = {};
    Object.entries(inputs).forEach(([qid, inp]) => { manual_points[qid] = inp.value; });
    const question_comments = {};
    Object.entries(commentInputs).forEach(([qid, inp]) => { question_comments[qid] = inp.value; });
    try {
      await api("/api/results/" + resultId + "/grade", {
        method: "POST",
        body: JSON.stringify({ manual_points, question_comments, comment: commentBox.value }),
      });
      state.tab = "bewertung";
      loadTab();
    } catch (e) {
      err.innerHTML = "";
      err.appendChild(el("div", { class: "error-banner", text: "Fehler beim Speichern der Bewertung." }));
    }
  });
  main.appendChild(err);
  main.appendChild(submitBtn);
}

function buildContentEditor(initialContent) {
  const data = JSON.parse(JSON.stringify(initialContent || []));
  const wrap = el("div", { class: "content-editor" });

  function renderAll() {
    wrap.innerHTML = "";
    data.forEach((chapter, ci) => {
      const chapCard = el("div", { style: "border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px" });
      const chapTitleInput = el("input", { type: "text", value: chapter.chapter || "" });
      chapTitleInput.addEventListener("input", () => { chapter.chapter = chapTitleInput.value; });
      chapCard.appendChild(el("label", { class: "field", text: "Kapitelname" }, [chapTitleInput]));

      (chapter.sections || []).forEach((section, si) => {
        const secWrap = el("div", { style: "margin:10px 0; padding-top:10px; border-top:1px solid var(--border)" });
        const secTitleInput = el("input", { type: "text", value: section.title || "" });
        secTitleInput.addEventListener("input", () => { section.title = secTitleInput.value; });
        const secTextArea = el("textarea", {});
        secTextArea.value = section.text || "";
        secTextArea.addEventListener("input", () => { section.text = secTextArea.value; });
        const removeSecBtn = el("button", { class: "btn secondary small", text: "Abschnitt entfernen" });
        removeSecBtn.addEventListener("click", () => { chapter.sections.splice(si, 1); renderAll(); });
        secWrap.appendChild(el("label", { class: "field", text: "Abschnittstitel" }, [secTitleInput]));
        secWrap.appendChild(el("label", { class: "field", text: "Text" }, [secTextArea]));
        secWrap.appendChild(removeSecBtn);
        chapCard.appendChild(secWrap);
      });

      const addSecBtn = el("button", { class: "btn secondary small", text: "Abschnitt hinzufügen" });
      const removeChapBtn = el("button", { class: "btn secondary small", text: "Kapitel entfernen" });
      removeChapBtn.style.marginLeft = "8px";
      addSecBtn.addEventListener("click", () => {
        if (!chapter.sections) chapter.sections = [];
        chapter.sections.push({ title: "", text: "" });
        renderAll();
      });
      removeChapBtn.addEventListener("click", () => { data.splice(ci, 1); renderAll(); });

      chapCard.appendChild(el("div", { style: "margin-top:8px" }, [addSecBtn, removeChapBtn]));
      wrap.appendChild(chapCard);
    });

    const addChapBtn = el("button", { class: "btn secondary small", text: "Kapitel hinzufügen" });
    addChapBtn.addEventListener("click", () => {
      data.push({ chapter: "Neues Kapitel", sections: [] });
      renderAll();
    });
    wrap.appendChild(addChapBtn);
  }

  renderAll();
  return { node: wrap, getValue: () => data };
}

async function tabTests(main) {
  const [tests, questions] = await Promise.all([api("/api/admin/tests"), api("/api/admin/questions")]);
  main.innerHTML = "";

  Object.values(tests).forEach(t => {
    const card = el("div", { class: "card" });
    const titleInput = el("input", { type: "text", value: t.title });
    const timeInput = el("input", { type: "number", value: String(t.time_limit_minutes) });
    const maxPointsInput = el("input", { type: "number", value: String(t.max_points), step: "1" });

    const editForm = el("div", { style: "display:none; margin-top:12px" }, [
      el("label", { class: "field", text: "Titel" }, [titleInput]),
      el("div", { class: "grid-2" }, [
        el("label", { class: "field", text: "Zeitlimit (Minuten)" }, [timeInput]),
        el("label", { class: "field", text: "Maximalpunktzahl" }, [maxPointsInput]),
      ]),
    ]);

    const contentEditor = buildContentEditor(t.content);
    editForm.appendChild(el("label", { class: "field", text: "Lerninhalt" }, [contentEditor.node]));

    const prereqSelect = el("select");
    prereqSelect.appendChild(el("option", { value: "", text: "Keine" }));
    Object.values(tests).forEach(other => {
      if (other.id === t.id) return;
      const opt = el("option", { value: other.id, text: other.title });
      if (t.prerequisite_test_id === other.id) opt.selected = true;
      prereqSelect.appendChild(opt);
    });
    editForm.appendChild(el("label", { class: "field", text: "Voraussetzung (muss vorher bestanden sein)" }, [prereqSelect]));

    const saveErr = el("div");
    const saveBtn = el("button", { class: "btn small", text: "Speichern" });
    saveBtn.addEventListener("click", async () => {
      saveErr.innerHTML = "";
      await api("/api/admin/tests/" + t.id, {
        method: "PUT",
        body: JSON.stringify({
          title: titleInput.value,
          time_limit_minutes: timeInput.value,
          max_points: maxPointsInput.value,
          content: contentEditor.getValue(),
          prerequisite_test_id: prereqSelect.value || null,
        }),
      });
      tabTests(main);
    });
    editForm.appendChild(saveErr);
    editForm.appendChild(saveBtn);

    const editBtn = el("button", { class: "btn secondary small", text: "Bearbeiten" });
    editBtn.addEventListener("click", () => {
      editForm.style.display = editForm.style.display === "none" ? "block" : "none";
    });
    const deleteBtn = el("button", { class: "btn secondary small", text: "Löschen" });
    deleteBtn.addEventListener("click", async () => {
      if (!confirm("Diese Fortbildung inkl. aller zugehörigen Fragen wirklich löschen?")) return;
      await api("/api/admin/tests/" + t.id, { method: "DELETE" });
      tabTests(main);
    });

    card.appendChild(el("div", { class: "row" }, [
      el("h3", { text: t.title }),
      el("span", { class: "muted", text: t.time_limit_minutes + " Min. · " + t.max_points + " Pkt." }),
    ]));
    const infoBits = [];
    if (t.prerequisite_test_id && tests[t.prerequisite_test_id]) {
      infoBits.push("Voraussetzung: " + tests[t.prerequisite_test_id].title);
    }
    if (infoBits.length) {
      card.appendChild(el("p", { class: "muted", text: infoBits.join(" · ") }));
    }
    const actionRow = el("div", { class: "btn-group" }, [editBtn, deleteBtn]);
    actionRow.style.marginTop = "10px";
    card.appendChild(actionRow);
    card.appendChild(editForm);

    const qList = el("div", { style: "margin-top:14px" });
    t.question_order.forEach(qid => {
      const q = questions[qid];
      if (!q) return;
      const item = el("div", { class: "list-item" });
      item.appendChild(el("span", { text: q.text }));
      item.appendChild(el("span", { class: "muted", text: q.type.toUpperCase() + " · " + q.points + " Pkt." }));
      const qEditBtn = el("button", { class: "btn secondary small", text: "Bearbeiten" });
      qEditBtn.addEventListener("click", () => openQuestionEditor(t.id, q));
      const qDelBtn = el("button", { class: "btn secondary small", text: "Löschen" });
      qDelBtn.addEventListener("click", async () => {
        if (!confirm("Diese Frage wirklich löschen?")) return;
        await api("/api/admin/questions/" + qid, { method: "DELETE" });
        tabTests(main);
      });
      item.appendChild(el("div", { class: "btn-group" }, [qEditBtn, qDelBtn]));
      qList.appendChild(item);
    });
    card.appendChild(qList);

    const addBtn = el("button", { class: "btn secondary small", text: "Frage hinzufügen" });
    addBtn.style.marginTop = "10px";
    addBtn.addEventListener("click", () => openQuestionEditor(t.id));
    card.appendChild(addBtn);

    main.appendChild(card);
  });

  const newCard = el("div", { class: "card" }, [el("h3", { text: "Neue Fortbildung anlegen" })]);
  const titleInput = el("input", { type: "text", placeholder: "Titel" });
  const timeInput = el("input", { type: "number", placeholder: "Zeitlimit (Minuten)", value: "30" });
  const maxPointsInput = el("input", { type: "number", placeholder: "Maximalpunktzahl", value: "40" });
  const createBtn = el("button", { class: "btn", text: "Anlegen" });
  createBtn.addEventListener("click", async () => {
    await api("/api/admin/tests", {
      method: "POST",
      body: JSON.stringify({ title: titleInput.value, time_limit_minutes: timeInput.value, max_points: maxPointsInput.value, content: [] }),
    });
    tabTests(main);
  });
  newCard.appendChild(el("label", { class: "field", text: "Titel" }, [titleInput]));
  newCard.appendChild(el("label", { class: "field", text: "Zeitlimit (Minuten)" }, [timeInput]));
  newCard.appendChild(el("label", { class: "field", text: "Maximalpunktzahl" }, [maxPointsInput]));
  newCard.appendChild(createBtn);
  main.appendChild(newCard);
}

function openQuestionEditor(testId, existing) {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const back = el("button", { class: "btn secondary small", text: "< Zurück" });
  back.addEventListener("click", () => loadTab());
  main.appendChild(back);

  const card = el("div", { class: "card" }, [el("h3", { text: existing ? "Frage bearbeiten" : "Neue Frage" })]);
  const typeSelect = el("select", {}, [
    el("option", { value: "mc", text: "Multiple Choice" }),
    el("option", { value: "tf", text: "Richtig / Falsch" }),
    el("option", { value: "open", text: "Offene Frage" }),
    el("option", { value: "praxis", text: "Praxisfrage" }),
  ]);
  if (existing) {
    typeSelect.value = existing.type;
    typeSelect.disabled = true;
  }
  const textInput = el("textarea", { placeholder: "Fragetext" });
  textInput.value = existing ? existing.text : "";
  const pointsInput = el("input", { type: "number", value: existing ? String(existing.points) : "2", min: "0", step: "0.5" });
  const optionsWrap = el("div");

  function renderOptions() {
    optionsWrap.innerHTML = "";
    if (typeSelect.value === "mc") {
      const existingOpts = existing && existing.options ? existing.options : [];
      const count = Math.max(3, existingOpts.length);
      const opts = Array.from({ length: count }, (_, i) => el("input", { type: "text", placeholder: "Option " + (i + 1) }));
      opts.forEach((o, i) => {
        if (existingOpts[i] !== undefined) o.value = existingOpts[i];
        optionsWrap.appendChild(el("label", { class: "field", text: "Option " + (i + 1) }, [o]));
      });
      optionsWrap.dataset.kind = "mc";
      optionsWrap._opts = opts;
      const correctInput = el("input", { type: "text", placeholder: "Index der richtigen Option(en), z.B. 0 oder 0,2" });
      if (existing && existing.correct) correctInput.value = existing.correct.join(",");
      optionsWrap.appendChild(el("label", { class: "field", text: "Richtige Option(en) - Index beginnend bei 0" }, [correctInput]));
      optionsWrap._correct = correctInput;
    } else if (typeSelect.value === "tf") {
      const sel = el("select", {}, [el("option", { value: "true", text: "Richtig" }), el("option", { value: "false", text: "Falsch" })]);
      if (existing) sel.value = existing.correct ? "true" : "false";
      optionsWrap.appendChild(el("label", { class: "field", text: "Korrekte Antwort" }, [sel]));
      optionsWrap.dataset.kind = "tf";
      optionsWrap._tf = sel;
    } else {
      optionsWrap.dataset.kind = "open";
    }
  }
  typeSelect.addEventListener("change", renderOptions);
  renderOptions();

  card.appendChild(el("label", { class: "field", text: "Typ" }, [typeSelect]));
  card.appendChild(el("label", { class: "field", text: "Fragetext" }, [textInput]));
  card.appendChild(el("label", { class: "field", text: "Punkte" }, [pointsInput]));
  card.appendChild(optionsWrap);

  const saveBtn = el("button", { class: "btn", text: existing ? "Änderungen speichern" : "Frage speichern" });
  saveBtn.addEventListener("click", async () => {
    const body = { test_id: testId, type: typeSelect.value, text: textInput.value, points: pointsInput.value };
    if (optionsWrap.dataset.kind === "mc") {
      body.options = optionsWrap._opts.map(o => o.value).filter(v => v.trim());
      body.correct = optionsWrap._correct.value.split(",").map(v => parseInt(v.trim(), 10)).filter(v => !isNaN(v));
    } else if (optionsWrap.dataset.kind === "tf") {
      body.correct = optionsWrap._tf.value === "true";
    }
    if (existing) {
      await api("/api/admin/questions/" + existing.id, { method: "PUT", body: JSON.stringify(body) });
    } else {
      await api("/api/admin/questions", { method: "POST", body: JSON.stringify(body) });
    }
    state.tab = "tests";
    loadTab();
  });
  card.appendChild(saveBtn);
  main.appendChild(card);
}

async function tabAlleErgebnisse(main) {
  const [results, stats] = await Promise.all([api("/api/admin/results"), api("/api/admin/stats")]);
  main.innerHTML = "";

  if (stats.length) {
    const statsCard = el("div", { class: "card" }, [el("h3", { text: "Statistik" })]);
    stats.forEach(s => {
      statsCard.appendChild(el("div", { class: "list-item" }, [
        el("span", { text: s.test_title }),
        el("span", { class: "muted", text: s.attempts + " Prüfungen · Ø " + s.avg_percent + " % · Durchfallquote " + s.fail_rate + " %" }),
      ]));
    });
    main.appendChild(statsCard);
  }

  if (!results.length) {
    main.appendChild(el("div", { class: "empty", text: "Noch keine Ergebnisse." }));
    return;
  }

  const searchInput = el("input", { type: "text", placeholder: "Suche nach Name oder Fortbildung ..." });
  const searchCard = el("div", { class: "card" }, [
    el("label", { class: "field", text: "Suche" }, [searchInput]),
  ]);
  main.appendChild(searchCard);

  const listWrap = el("div");
  main.appendChild(listWrap);

  function renderList() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = results.filter(r =>
      !q || r.username.toLowerCase().includes(q) || r.test_title.toLowerCase().includes(q)
    );
    listWrap.innerHTML = "";
    if (!filtered.length) {
      listWrap.appendChild(el("div", { class: "empty", text: "Keine Treffer." }));
      return;
    }
    filtered.forEach(r => {
      const card = el("div", { class: "card" });
      const statusBadge = r.status === "bewertet"
        ? el("span", { class: "badge " + (r.percent >= 60 ? "pass" : "fail"), text: "Note " + r.grade + " (" + r.percent + "%)" })
        : el("span", { class: "badge pending", text: STATUS_LABEL[r.status] || r.status });
      card.appendChild(el("div", { class: "row" }, [
        el("h3", { text: r.username + " - " + r.test_title }),
        statusBadge,
      ]));
      card.appendChild(el("p", { class: "muted", text: "Abgegeben: " + fmtDate(r.submitted_at) }));
      if (r.status === "bewertet") {
        const openBtn = el("button", { class: "btn secondary small", text: "Details ansehen" });
        openBtn.addEventListener("click", () => openAdminResultDetail(r.id));
        card.appendChild(openBtn);
      }
      listWrap.appendChild(card);
    });
  }

  searchInput.addEventListener("input", renderList);
  renderList();
}

async function openAdminResultDetail(resultId) {
  const main = document.getElementById("main");
  const detail = await api("/api/results/" + resultId);
  const r = detail.result;
  const questions = detail.questions;
  main.innerHTML = "";

  const back = el("button", { class: "btn secondary small", text: "< Zurück" });
  back.addEventListener("click", () => { state.tab = "alle-ergebnisse"; loadTab(); });
  main.appendChild(back);

  const passed = r.percent >= 60;
  main.appendChild(el("div", { class: "card" }, [
    el("div", { class: "row" }, [
      el("h3", { text: r.username + " - " + r.test_title }),
      el("span", { class: "badge " + (passed ? "pass" : "fail"), text: (passed ? "Bestanden" : "Nicht bestanden") + " · Note " + r.grade }),
    ]),
    el("p", { text: r.total_score + " / " + r.max_points + " Punkte (" + r.percent + " %) · automatisch: " + r.auto_score + " · manuell: " + r.manual_score }),
    el("p", { class: "muted", text: "Abgegeben am " + fmtDate(r.submitted_at) + " · bewertet von " + (r.graded_by_name || "-") + " am " + fmtDate(r.graded_at) }),
    r.comment ? el("p", { text: "Kommentar: " + r.comment }) : null,
  ]));

  questions.forEach(q => {
    const given = r.answers[q.id];
    const card = el("div", { class: "card" });
    card.appendChild(el("div", { class: "qtext", text: q.text + " (" + q.points + " Punkte)" }));
    if (q.type === "mc") {
      const correctIdx = new Set(q.correct);
      const givenIdx = new Set(Array.isArray(given) ? given : []);
      q.options.forEach((opt, i) => {
        card.appendChild(el("div", { class: "option-row", text: (givenIdx.has(i) ? "☑ " : "☐ ") + opt + (correctIdx.has(i) ? "  (richtig)" : "") }));
      });
    } else if (q.type === "tf") {
      [true, false].forEach(val => {
        const isGiven = given === val;
        const isCorrect = q.correct === val;
        card.appendChild(el("div", { class: "option-row", text: (isGiven ? "☑ " : "☐ ") + (val ? "Richtig" : "Falsch") + (isCorrect ? "  (richtig)" : "") }));
      });
    } else {
      card.appendChild(el("p", { text: given || "(keine Antwort)" }));
      const pts = (r.manual_points || {})[q.id];
      card.appendChild(el("p", { class: "muted", text: "Vergebene Punkte: " + (pts !== undefined ? pts : "0") + " / " + q.points }));
      const note = (r.question_comments || {})[q.id];
      if (note) card.appendChild(el("p", { text: "Kommentar: " + note }));
    }
    main.appendChild(card);
  });
}

// ---------------------------------------------------------------------
// Prüfungsansicht
// ---------------------------------------------------------------------

let examTimer = null;

function startExam(attemptId) {
  state.view = "exam";
  state.examAttemptId = attemptId;
  render();
}

function renderExamShell() {
  const wrap = el("div", { id: "exam-root" });
  setTimeout(loadExam, 0);
  return wrap;
}

async function loadExam() {
  const root = document.getElementById("exam-root");
  const attempt = await api("/api/attempt/" + state.examAttemptId);

  if (attempt.status === "bereit") {
    root.innerHTML = "";
    root.appendChild(el("div", { class: "login-screen" }, [
      el("h1", { text: attempt.test_title }),
      el("p", { text: "Dies ist eine Prüfung. Du hast dafür " + attempt.time_limit_minutes + " Minuten Zeit. " +
                       "Die Zeit beginnt zu laufen, sobald du auf OK klickst." }),
      el("button", {
        class: "btn", text: "OK, Prüfung starten",
        onclick: async () => {
          const started = await api("/api/attempt/" + state.examAttemptId + "/start", { method: "POST" });
          renderExamQuestions(started.test_title, started.deadline, started.questions, {});
        },
      }),
    ]));
    return;
  }

  if (attempt.status === "in_bearbeitung") {
    renderExamQuestions(attempt.test_title, attempt.deadline, attempt.questions, attempt.answers);
    return;
  }

  root.innerHTML = "";
  root.appendChild(el("div", { class: "login-screen" }, [
    el("h1", { text: "Test bereits abgegeben" }),
    el("button", { class: "btn", onclick: backToApp, text: "Zurück zum Portal" }),
  ]));
}

function renderExamQuestions(testTitle, deadlineIso, questionList, initialAnswers) {
  const root = document.getElementById("exam-root");
  const answers = Object.assign({}, initialAnswers);

  root.innerHTML = "";
  const header = el("header", {}, [
    el("div", { class: "brand", text: testTitle }),
    el("div", { class: "timer", id: "exam-timer", text: "--:--" }),
  ]);
  root.appendChild(header);

  const main = el("main");
  questionList.forEach(q => {
    const card = el("div", { class: "card question" });
    card.appendChild(el("div", { class: "row", style: "align-items:flex-start" }, [
      el("div", { class: "qtext", text: q.text }),
      el("span", { class: "points-tag", text: q.points + " Punkte" }),
    ]));

    if (q.type === "mc") {
      q.options.forEach((opt, i) => {
        const cb = el("input", { type: "checkbox" });
        cb.checked = Array.isArray(answers[q.id]) && answers[q.id].includes(i);
        cb.addEventListener("change", () => {
          const cur = new Set(answers[q.id] || []);
          if (cb.checked) cur.add(i); else cur.delete(i);
          answers[q.id] = Array.from(cur);
        });
        const row = el("label", { class: "option-row" }, [cb, el("span", { text: opt })]);
        card.appendChild(row);
      });
    } else if (q.type === "tf") {
      const name = "tf_" + q.id;
      ["true", "false"].forEach(v => {
        const rb = el("input", { type: "radio", name });
        rb.checked = answers[q.id] === (v === "true");
        rb.addEventListener("change", () => { answers[q.id] = v === "true"; });
        card.appendChild(el("label", { class: "option-row" }, [rb, el("span", { text: v === "true" ? "Richtig" : "Falsch" })]));
      });
    } else {
      const ta = el("textarea", { placeholder: "Deine Antwort ..." });
      ta.value = answers[q.id] || "";
      ta.addEventListener("input", () => { answers[q.id] = ta.value; });
      card.appendChild(ta);
    }
    main.appendChild(card);
  });

  const err = el("div");
  const submitBtn = el("button", { class: "btn", text: "Test abgeben" });
  const saveState = el("span", { class: "muted", style: "margin-left:10px" });

  async function doSave(silent) {
    try {
      await api("/api/attempt/" + state.examAttemptId + "/save", { method: "POST", body: JSON.stringify({ answers }) });
      if (!silent) { saveState.textContent = "Gespeichert"; setTimeout(() => saveState.textContent = "", 1500); }
    } catch (e) { /* ignore */ }
  }

  async function doSubmit() {
    if (examTimer) clearInterval(examTimer);
    try {
      await api("/api/attempt/" + state.examAttemptId + "/submit", { method: "POST", body: JSON.stringify({ answers }) });
      backToApp();
    } catch (e) {
      err.innerHTML = "";
      err.appendChild(el("div", { class: "error-banner", text: "Der Test wurde bereits abgegeben." }));
    }
  }

  submitBtn.addEventListener("click", doSubmit);
  main.appendChild(err);
  main.appendChild(el("div", { class: "row" }, [submitBtn, saveState]));
  root.appendChild(main);

  setInterval(() => doSave(true), 15000);

  const deadline = new Date(deadlineIso).getTime();
  function tick() {
    const remain = Math.max(0, deadline - Date.now());
    const mins = Math.floor(remain / 60000);
    const secs = Math.floor((remain % 60000) / 1000);
    const timerEl = document.getElementById("exam-timer");
    if (timerEl) timerEl.textContent = String(mins).padStart(2, "0") + ":" + String(secs).padStart(2, "0");
    if (remain <= 0) {
      clearInterval(examTimer);
      doSubmit();
    }
  }
  tick();
  examTimer = setInterval(tick, 1000);
}

function backToApp() {
  if (examTimer) clearInterval(examTimer);
  state.view = "app";
  state.tab = state.tab || defaultTab(state.me.role);
  render();
}

boot();
